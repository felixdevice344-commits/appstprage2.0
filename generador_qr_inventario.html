<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVICE | Label Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Librería para generar QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: #141414;
            --c-blue: #00f0ff;
            --c-yellow: #fcee0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #eee;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
        }

        .glass-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        /* Decoración Tech */
        .tech-deco::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border-top: 3px solid var(--c-blue);
            border-left: 3px solid var(--c-blue);
        }

        .tech-deco::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            border-bottom: 3px solid var(--c-blue);
            border-right: 3px solid var(--c-blue);
        }

        .input-tech {
            background: #000;
            border: 1px solid #333;
            color: var(--c-blue);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 15px;
            font-size: 1.2rem;
        }

        .input-tech:focus {
            outline: none;
            border-color: var(--c-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .btn-cyber {
            background: var(--c-blue);
            color: #000;
            border: none;
            font-weight: bold;
            padding: 15px 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-cyber:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--c-blue);
        }

        /* ESTILO DE LA ETIQUETA (LABEL) */
        #label-preview {
            background: #fff;
            color: #000;
            width: 400px;
            height: 250px;
            padding: 20px;
            border: 2px dashed #555;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            margin: 0 auto;
        }

        .label-data {
            text-align: left;
            width: 60%;
        }

        .label-qr {
            width: 140px;
            height: 140px;
        }

        /* Estilos para impresión */
        @media print {
            body * {
                visibility: hidden;
            }

            #label-area,
            #label-area * {
                visibility: visible;
            }

            #label-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #label-preview {
                border: 2px solid #000;
            }

            /* Borde sólido al imprimir */
            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card tech-deco">
        <div class="row">
            <!-- PANEL DE CONTROL -->
            <div class="col-md-6 border-end border-secondary pe-5">
                <h3 class="mb-4 text-white"><i class="fas fa-barcode me-2"></i> GENERADOR DE ETIQUETAS</h3>
                <p class="text-white-50 mb-4">Crea códigos QR compatibles con el módulo de Inventario de DEVICE OS.</p>

                <div class="mb-3">
                    <label class="form-label text-info small">SKU / CÓDIGO DE MATERIAL</label>
                    <input type="text" id="sku-input" class="form-control input-tech" placeholder="EJ: ACERO-304-X"
                        onkeyup="generateQR()">
                </div>

                <div class="mb-4">
                    <label class="form-label text-info small">DESCRIPCIÓN (OPCIONAL)</label>
                    <input type="text" id="desc-input" class="form-control input-tech"
                        placeholder="EJ: LÁMINA CALIBRE 18" onkeyup="updateLabel()">
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-cyber" onclick="window.print()"><i class="fas fa-print me-2"></i> IMPRIMIR
                        ETIQUETA</button>
                    <button class="btn btn-outline-secondary rounded-0" onclick="clearForm()">LIMPIAR</button>
                </div>
            </div>

            <!-- VISTA PREVIA -->
            <div class="col-md-6 d-flex flex-column align-items-center justify-content-center" id="label-area">
                <h5 class="text-white-50 mb-3 no-print">VISTA PREVIA DE IMPRESIÓN</h5>

                <!-- ETIQUETA FÍSICA -->
                <div id="label-preview">
                    <div class="label-data">
                        <h2 class="fw-bold m-0" style="font-size: 2rem;" id="lbl-sku">SKU-000</h2>
                        <p class="m-0 text-muted" id="lbl-desc">DESCRIPCIÓN DEL ITEM</p>
                        <hr class="my-2">
                        <small class="fw-bold">DEVICE OS INVENTORY</small><br>
                        <small id="lbl-date">2023-01-01</small>
                    </div>
                    <div id="qrcode" class="label-qr"></div>
                </div>

                <p class="mt-3 text-info small no-print"><i class="fas fa-info-circle"></i> Este código será leído
                    automáticamente por la App Móvil.</p>
            </div>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById("qrcode");
        let qrcode = new QRCode(qrContainer, {
            width: 140,
            height: 140,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function generateQR() {
            const sku = document.getElementById("sku-input").value.toUpperCase() || "SKU-000";
            const desc = document.getElementById("desc-input").value.toUpperCase() || "DESCRIPCIÓN";

            // Actualizar Texto
            document.getElementById("lbl-sku").innerText = sku;
            document.getElementById("lbl-desc").innerText = desc;
            document.getElementById("lbl-date").innerText = new Date().toLocaleDateString();

            // Actualizar QR (Solo el SKU es necesario para el escáner)
            qrcode.clear();
            qrcode.makeCode(sku);
        }

        function clearForm() {
            document.getElementById("sku-input").value = "";
            document.getElementById("desc-input").value = "";
            generateQR();
            document.getElementById("sku-input").focus();
        }

        // Init
        generateQR();
    </script>
</body>

</html>
